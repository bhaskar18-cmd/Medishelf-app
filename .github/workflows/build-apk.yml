name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Initialize or Sync Capacitor Android
        run: |
          if [ ! -d "android/app" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Google Services for Android
        run: |
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          fi
          if [ -f "android/build.gradle" ] && ! grep -q "google-services" android/build.gradle; then
            sed -i '/dependencies {/a \        classpath "com.google.gms:google-services:4.4.2"' android/build.gradle
          fi
          if [ -f "android/app/build.gradle" ] && ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          fi

      - name: Add Camera Permissions to AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA" />' "$MANIFEST"
          fi

      - name: Register Firebase Authentication Plugin in MainActivity
        run: |
          MAIN_ACTIVITY="android/app/src/main/java/com/bhaskar18/medishelf/MainActivity.java"
          if [ -f "$MAIN_ACTIVITY" ] && ! grep -q "FirebaseAuthenticationPlugin" "$MAIN_ACTIVITY"; then
            sed -i '/import com.getcapacitor.BridgeActivity;/a import android.os.Bundle;\nimport io.capawesome.capacitorjs.plugins.firebase.authentication.FirebaseAuthenticationPlugin;' "$MAIN_ACTIVITY"
            sed -i '/public class MainActivity extends BridgeActivity {/a \    @Override\n    public void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        registerPlugin(FirebaseAuthenticationPlugin.class);\n    }' "$MAIN_ACTIVITY"
          fi

      - name: Build Debug APK with Gradle
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.JAVA_HOME }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Generate Android Signing Report
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.JAVA_HOME }}
        run: |
          cd android
          chmod +x gradlew
          echo "=================================================="
          echo "GENERATING AND PRINTING DEBUG SIGNING REPORT..."
          echo "=================================================="
          ./gradlew :app:signingReport
          echo "=================================================="

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: medishelf-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
